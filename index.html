<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List App</title>

    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" href="assets/images/icon.png" type="image/png" />
</head>

<body>
<main class="app-container">
    <section class="todo-app" aria-labelledby="app-title">

        <!-- Header -->
        <header class="app-header">
            <h1 id="app-title">To-Do List App</h1>
            <img src="assets/images/icon.png" alt="Application logo" class="app-icon" />
        </header>

        <!-- Task Input -->
        <section class="task-input" aria-label="Add new task">
            <input id="task-input" type="text" placeholder="Enter task..." required />

            <input id="task-date" type="date" />

            <select id="task-category">
                <option value="General">General</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Personal">Personal</option>
            </select>

            <select id="task-priority">
                <option value="low">Low Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="high">High Priority</option>
            </select>

            <button id="add-task-btn" class="btn-primary">Add Task</button>
        </section>

        <!-- Progress -->
        <section class="progress-section">
            <div class="progress-circle">
                <svg width="120" height="120">
                    <circle cx="60" cy="60" r="50" class="progress-bg"></circle>
                    <circle cx="60" cy="60" r="50" id="progress-bar"></circle>
                </svg>
                <span id="progress-text">0%</span>
            </div>
        </section>

        <!-- Controls -->
        <section class="controls">
            <button id="dark-mode-toggle" class="btn-secondary">Toggle Dark Mode</button>
        </section>

        <br>
        
        <!-- Filters -->
        <section class="filters">
            <div class="filter-group">
                <button data-filter="all">All</button>
                <button data-filter="General">General</button>
                <button data-filter="Work">Work</button>
                <button data-filter="Study">Study</button>
                <button data-filter="Personal">Personal</button>
            </div>

            <div class="sort-group">
                <button data-sort="priority">Sort by Priority</button>
                <button data-sort="date">Sort by Due Date</button>
            </div>
        </section>

        <!-- Task List -->
        <section class="task-list">
            <ul id="task-list"></ul>
        </section>

    </section>
</main>

<script src="assets/js/script.js"></script>
</body>
</html>
